[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "long-horizon-memory-agent"
version = "0.1.0"
description = "Long-horizon multi-agent workflow with durable memory and evidence-based training"
requires-python = ">=3.11"
dependencies = ["langchain-core>=1,<2", "langchain-openai>=1,<2", "langgraph>=1,<2"]

[project.optional-dependencies]
train = ["datasets>=3,<5", "transformers>=4.45,<6", "trl>=0.21,<2", "peft>=0.13,<1", "accelerate>=1,<2", "torch>=2.4"]
test = ["pytest>=8,<10"]

[project.scripts]
horizon-agent = "horizon_agent.cli:main"

[tool.setuptools.packages.find]
include = ["horizon_agent*"]
